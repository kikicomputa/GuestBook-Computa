<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Welcome Screen - Computa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .bg-gedung {
      background-image: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.7) 60%, #ffffff 100%),
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1200&auto=format&fit=crop');
      background-size: cover;
      background-position: left center;
    }
  </style>
</head>
<body class="bg-white h-screen w-screen overflow-hidden flex">

  <!-- Sisi Kiri: Foto Gedung Computa Fade -->
  <div class="w-1/3 h-full bg-gedung relative hidden md:block">
    <div class="absolute bottom-10 left-10 bg-black/40 backdrop-blur-md p-4 rounded-xl text-white">
      <p class="font-bold text-lg tracking-wider">COMPUTA</p>
      <p class="text-xs text-gray-200">The Real Computer Center</p>
    </div>
  </div>

  <!-- Sisi Kanan: Area Interaksi Presensi -->
  <div class="flex-1 h-full flex flex-col justify-between p-12 bg-white relative">
    
    <!-- Top Header -->
    <div class="flex flex-col items-center">
      <span class="text-xs tracking-[0.25em] font-extrabold text-gray-400 uppercase mb-2">COMPUTA</span>
      <span id="badge-gate" class="bg-[#c5a059] text-white px-5 py-1.5 rounded-full text-xs font-bold tracking-widest uppercase shadow-sm">
        COUNTER 1
      </span>
    </div>

    <!-- Konten Utama & Transisi Sambutan -->
    <div class="max-w-2xl w-full mx-auto text-center" id="main-container">
      <div id="default-screen">
        <h1 id="event-title" class="text-4xl font-extrabold text-[#0f2744] tracking-tight uppercase mb-3">MEMUAT EVENT...</h1>
        <p class="text-gray-500 text-sm mb-8">Arahkan scanner QR atau masukkan kode unik Anda.</p>

        <form id="form-scan" onsubmit="handleScan(event)" class="relative max-w-lg mx-auto">
          <input 
            type="text" 
            id="ticket-input" 
            placeholder="MASUKKAN KODE UNIK" 
            autocomplete="off"
            autofocus
            class="w-full text-center tracking-widest text-lg font-bold border-2 border-gray-200 rounded-2xl py-4 px-6 focus:outline-none focus:border-[#0f2744] shadow-sm transition placeholder-gray-300"
          />
        </form>
        <p id="error-msg" class="text-red-500 font-semibold text-xs mt-3 hidden"></p>
      </div>

      <!-- Kartu Sambutan (Success State) -->
      <div id="success-screen" class="hidden animate-fade-in bg-emerald-50 border border-emerald-200 rounded-3xl p-8">
        <span class="bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-wider">Berhasil Presensi</span>
        <h2 id="guest-name" class="text-3xl font-black text-gray-900 mt-4 mb-1">Nama Tamu</h2>
        <p id="guest-agency" class="text-gray-600 font-semibold text-base mb-4">Instansi</p>
        <p id="check-time" class="text-xs font-mono text-emerald-700">Waktu: 00:00:00</p>
      </div>
    </div>

    <!-- Footer: Info Event -->
    <div class="border-t border-gray-100 pt-6 flex justify-around max-w-3xl w-full mx-auto text-xs text-gray-600">
      <div class="flex items-center gap-2">
        <span class="text-gray-400 font-bold uppercase tracking-wider">Tanggal</span>
        <span id="meta-date" class="font-bold text-gray-800">-</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-gray-400 font-bold uppercase tracking-wider">Tempat</span>
        <span id="meta-location" class="font-bold text-gray-800">-</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-gray-400 font-bold uppercase tracking-wider">Waktu</span>
        <span id="meta-time" class="font-bold text-gray-800">-</span>
      </div>
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const counterParam = urlParams.get('counter') || '1';
    const currentGate = "Lajur 0" + counterParam;

    document.getElementById('badge-gate').innerText = "COUNTER " + counterParam;

    function initConfig() {
      google.script.run.withSuccessHandler(function(data) {
        if (data && data.status === 'AKTIF') {
          document.getElementById('event-title').innerText = data.title;
          document.getElementById('meta-date').innerText = data.date;
          document.getElementById('meta-location').innerText = data.location;
          document.getElementById('meta-time').innerText = data.time;
        } else {
          document.getElementById('event-title').innerText = "EVENT TIDAK AKTIF / TERKUNCI";
          document.getElementById('ticket-input').disabled = true;
        }
      }).apiGetActiveConfig();
    }

    function handleScan(e) {
      e.preventDefault();
      const input = document.getElementById('ticket-input');
      const code = input.value.trim();
      const err = document.getElementById('error-msg');
      err.classList.add('hidden');
      if (!code) return;

      google.script.run.withSuccessHandler(function(res) {
        input.value = '';
        if (res.status === 'success') {
          showSuccess(res.name, res.agency, res.time);
        } else {
          err.innerText = res.message;
          err.classList.remove('hidden');
          input.focus();
        }
      }).apiCheckIn(code, currentGate);
    }

    function showSuccess(name, agency, time) {
      document.getElementById('default-screen').classList.add('hidden');
      document.getElementById('success-screen').classList.remove('hidden');
      document.getElementById('guest-name').innerText = name;
      document.getElementById('guest-agency').innerText = agency;
      document.getElementById('check-time').innerText = "Waktu Presensi: " + time + " di " + currentGate;

      setTimeout(function() {
        document.getElementById('success-screen').classList.add('hidden');
        document.getElementById('default-screen').classList.remove('hidden');
        document.getElementById('ticket-input').focus();
      }, 4000);
    }

    window.onload = function() {
      initConfig();
      document.getElementById('ticket-input').focus();
      document.addEventListener('click', () => document.getElementById('ticket-input').focus());
    };
  </script>
</body>
</html>
